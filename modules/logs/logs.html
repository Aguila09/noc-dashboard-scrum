<section class="module-panel">
  <h2>Analizador de Tráfico en Tiempo Real</h2>
  <p>Monitoreo del volumen de tráfico, conexiones y bloqueos activos.</p>

  <div class="metrics">
    <div class="metric">
      <span>Paquetes totales</span>
      <strong id="logs-packets">0</strong>
    </div>
    <div class="metric">
      <span>Throughput</span>
      <strong id="logs-throughput">0 Mbps</strong>
    </div>
    <div class="metric">
      <span>Intentos bloqueados</span>
      <strong id="logs-blocked">0</strong>
    </div>
  </div>
</section>
