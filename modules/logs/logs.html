<section class="module-panel">
  <h2>Analizador de Tráfico en Tiempo Real</h2>
  <p>Monitoreo del volumen de tráfico, conexiones y bloqueos activos.</p>

  <div class="metrics">
    <div class="metric">
      <span>Paquetes totales</span>
      <strong id="logs-packets">0</strong>
    </div>
    <div class="metric">
      <span>Throughput</span>
      <strong id="logs-throughput">0 Mbps</strong>
    </div>
    <div class="metric">
      <span>Intentos bloqueados</span>
      <strong id="logs-blocked">0</strong>
    </div>
  </div>

  <div class="logs-panel">
    <div class="traffic-row">
      <span>Conexiones activas</span>
      <strong id="logs-connections">0</strong>
    </div>
    <div class="traffic-row">
      <span>Latencia promedio</span>
      <strong id="logs-latency">0 ms</strong>
    </div>
    <div class="traffic-meter">
      <div class="traffic-meter-label">
        <span>Protección activa</span>
        <strong id="logs-health">Estable</strong>
      </div>
      <div class="meter-track">
        <div id="logs-progress" class="meter-fill"></div>
      </div>
    </div>
  </div>
</section>
